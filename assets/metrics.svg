  <text x="796" y="72" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="38" font-weight="800" fill="#A371F7" text-anchor="middle" filter="url(#soft)">5</text>
  <text x="796" y="95" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="10.5" fill="#8B949E" text-anchor="middle" letter-spacing="1.5">ENGINEERING ROLES</text>
</g><g>
  <rect x="961" y="20" width="297" height="92" rx="14" fill="#0E131A" fill-opacity="0.82" stroke="#21262D"/>
