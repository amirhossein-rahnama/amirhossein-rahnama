  <text x="170" y="95" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="10.5" fill="#8B949E" text-anchor="middle" letter-spacing="1.5">YEARS SHIPPING DATA SYSTEMS</text>
</g><g>
  <rect x="335" y="20" width="297" height="92" rx="14" fill="#0E131A" fill-opacity="0.82" stroke="#21262D"/>
  <rect x="335" y="20" width="297" height="2.6" rx="1.3" fill="#39D0D8" opacity="0.85"/>
  <text x="484" y="72" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="38" font-weight="800" fill="#39D0D8" text-anchor="middle" filter="url(#soft)">~30%</text>
  <text x="484" y="95" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="10.5" fill="#8B949E" text-anchor="middle" letter-spacing="1.5">MANUAL REPORTING REMOVED</text>
</g><g>
  <rect x="648" y="20" width="297" height="92" rx="14" fill="#0E131A" fill-opacity="0.82" stroke="#21262D"/>
