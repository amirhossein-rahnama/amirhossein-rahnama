  <text x="1110" y="72" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="38" font-weight="800" fill="#39D0D8" text-anchor="middle" filter="url(#soft)">4</text>
  <text x="1110" y="95" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="10.5" fill="#8B949E" text-anchor="middle" letter-spacing="1.5">LANGUAGES SPOKEN</text>
</g></svg>