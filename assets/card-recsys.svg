<svg xmlns="http://www.w3.org/2000/svg" width="480" height="204" viewBox="0 0 480 204" role="img" aria-label="recommender-system">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#0D1117"/><stop offset="55%" stop-color="#0A0E14"/><stop offset="100%" stop-color="#080B10"/>
</linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#58A6FF"/><stop offset="50%" stop-color="#39D0D8"/><stop offset="100%" stop-color="#A371F7"/>
</linearGradient>
<linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#FFFFFF"/><stop offset="42%" stop-color="#58A6FF"/>
  <stop offset="76%" stop-color="#39D0D8"/><stop offset="100%" stop-color="#A371F7"/>
</linearGradient>
<linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#58A6FF" stop-opacity="0"/><stop offset="22%" stop-color="#58A6FF"/>
  <stop offset="55%" stop-color="#39D0D8"/><stop offset="82%" stop-color="#A371F7"/>
  <stop offset="100%" stop-color="#A371F7" stop-opacity="0"/>
</linearGradient>
<radialGradient id="au1"><stop offset="0%" stop-color="#58A6FF" stop-opacity="0.30"/><stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/></radialGradient>
<radialGradient id="au2"><stop offset="0%" stop-color="#39D0D8" stop-opacity="0.26"/><stop offset="100%" stop-color="#39D0D8" stop-opacity="0"/></radialGradient>
<radialGradient id="au3"><stop offset="0%" stop-color="#A371F7" stop-opacity="0.28"/><stop offset="100%" stop-color="#A371F7" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
  <path d="M32 0 L0 0 0 32" fill="none" stroke="#1B2029" stroke-width="1"/>
</pattern>
<filter id="soft" x="-90%" y="-90%" width="280%" height="280%">
  <feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
  <feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<rect width="480" height="204" rx="16" fill="url(#bg)"/>
<ellipse cx="440" cy="24" rx="190" ry="110" fill="url(#au2)" opacity="0.8"/>
<rect width="480" height="204" rx="16" fill="url(#grid)" opacity="0.30"/>
<rect x="0.5" y="0.5" width="479" height="203" rx="16" fill="none" stroke="#21262D"/>
<rect x="0" y="0" width="4" height="204" rx="2" fill="#A371F7" opacity="0.9"/>
<text x="454" y="44" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="30" font-weight="700" fill="#A371F7" fill-opacity="0.22" text-anchor="end">03</text>
<text x="28" y="50" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#E6EDF3">recommender-system</text>
<line x1="28" y1="64" x2="92" y2="64" stroke="#A371F7" stroke-width="2.4" stroke-linecap="round"/>
<text x="28" y="104" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13.5" fill="#8B949E">Recommendation engine enriched with metadata</text><text x="28" y="125" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13.5" fill="#8B949E">pulled from external music APIs.</text>
<g><rect x="28" y="154" rx="13" width="71" height="26" fill="#12171F" fill-opacity="0.9" stroke="#2A313C" stroke-width="1"/><text x="63" y="171.5" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12" fill="#8B949E" text-anchor="middle" letter-spacing="0.3">Python</text></g><g><rect x="108" y="154" rx="13" width="48" height="26" fill="#12171F" fill-opacity="0.9" stroke="#2A313C" stroke-width="1"/><text x="132" y="171.5" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12" fill="#8B949E" text-anchor="middle" letter-spacing="0.3">NLP</text></g><g><rect x="165" y="154" rx="13" width="115" height="26" fill="#12171F" fill-opacity="0.9" stroke="#2A313C" stroke-width="1"/><text x="223" y="171.5" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12" fill="#8B949E" text-anchor="middle" letter-spacing="0.3">scikit-learn</text></g>
<circle cx="450" cy="172" r="3" fill="#A371F7" filter="url(#soft)">
  <animate attributeName="fill-opacity" values="1;0.25;1" dur="3s" repeatCount="indefinite"/></circle>
</svg>